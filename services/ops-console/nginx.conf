server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. A variable in proxy_pass makes nginx re-resolve ops-api at
    # request time: a fixed name is resolved once at startup, so recreating the ops-api
    # container (new IP) would break the console with 502s until nginx restarted.
    resolver 127.0.0.11 valid=10s;

    location /v1/ {
        set $ops_api http://ops-api:8080;
        proxy_pass $ops_api;
    }

    location / {
        try_files $uri /index.html;
    }
}
