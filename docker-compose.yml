# Full local stack: Redpanda (Kafka API), Postgres, Jaeger, Prometheus, the TypeScript
# carrier-gateway and five Python services. `make up && make smoke`.
x-python-service: &python-service
  build:
    context: .
    dockerfile: docker/Dockerfile.python
  environment:
    # Interpolated from the shell or ./.env; empty key = agent cases escalate to ops.
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    AGENT_MODEL: ${AGENT_MODEL:-qwen/qwen3-30b-a3b}
    KAFKA_BOOTSTRAP: redpanda:9092
    DATABASE_URL: postgresql://shipex:shipex@postgres:5432/shipex
    CARRIER_GATEWAY_URL: http://carrier-gateway:8081
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    METRICS_PORT: "9100"
  depends_on: &python-deps
    redpanda:
      condition: service_healthy
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shipex
      POSTGRES_PASSWORD: shipex
      POSTGRES_DB: shipex
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipex"]
      interval: 5s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  carrier-gateway:
    build: services/carrier-gateway
    environment:
      PORT: "8081"
      ADMIN_ENABLED: "true"
      FAULT_RATE: ${FAULT_RATE:-0}
      LATENCY_MS: ${LATENCY_MS:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: carrier-gateway
    ports: ["8081:8081"]
    restart: unless-stopped

  ingest-api:
    <<: *python-service
    command: >-
      uvicorn shipex.services.ingest_api:app_from_env --factory --host 0.0.0.0 --port 8080
    ports: ["${INGEST_PORT:-8080}:8080"]

  router:
    <<: *python-service
    command: python -m shipex.services.worker router

  playbook:
    <<: *python-service
    command: python -m shipex.services.worker playbook

  agent:
    <<: *python-service
    command: python -m shipex.services.worker agent
    depends_on:
      <<: *python-deps
      carrier-gateway:
        condition: service_started

  notifier:
    <<: *python-service
    command: python -m shipex.services.worker notifier
